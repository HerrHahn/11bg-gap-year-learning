name = "11bg-writing-feedback"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://herrhahn.github.io"
OPENAI_MODEL = "gpt-4.1-mini"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# Add OPENAI_API_KEY and ACCESS_CODES through Cloudflare Secrets, never here.
# ACCESS_CODES: comma-separated random codes, at least 16 characters each.

[[durable_objects.bindings]]
name = "RESULTS"
class_name = "Results"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Results"]
